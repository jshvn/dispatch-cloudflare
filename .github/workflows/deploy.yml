name: deploy
on:
  push:
    branches: [main]
    # A deny-list, not an allow-list: anything not named here deploys. A new file that ships
    # is covered by default, so the failure mode is a redundant deploy, never a skipped one.
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
      - Taskfile.yml
      - .github/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx wrangler types && npx tsc --noEmit && npx vitest run
      # The deploy credentials live in 1Password (vault jshvn, item dispatch); the one GitHub
      # secret is the service account token that reads them. Loaded after the test steps so
      # third-party tooling never has them in its environment; export-env puts both names
      # in the environment of every later step.
      - uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://h76djdgmekqkxh77hiiwse3ara/dispatch/cloudflare/token
          CLOUDFLARE_ACCOUNT_ID: op://h76djdgmekqkxh77hiiwse3ara/dispatch/cloudflare/account_id
      # Worker secrets are set once with `wrangler secret put` and are not managed from here.
      - run: npx wrangler deploy
