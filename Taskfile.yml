# Common commands. Bare `task` prints the menu; `task --list` is the generated view.
#
# Deploys are automatic: .github/workflows/deploy.yml runs on push to main. Everything here
# is either a local check or a by-hand operation, and the Cloudflare ones need credentials
# of their own -- `npx wrangler login` once, or CLOUDFLARE_API_TOKEN in the environment.
version: '3'

set: [errexit, pipefail]
silent: true

vars:
  # The Workflow's name in wrangler.jsonc. Wrangler addresses instances by it.
  NAME: dispatch
  # The target list, read out of schedules/ itself so nothing here can drift from it.
  # Node imports the TypeScript directly (type stripping), so there is no build step.
  TARGETS: >-
    node -e 'const {SLOTS, TARGETS} = await import("./schedules/index.ts");
    const slot = (c) => Object.keys(SLOTS).find((s) => SLOTS[s] === c);
    for (const t of TARGETS) console.log([slot(t.cron), t.cron, t.repo, t.workflow].join("\t"))'

tasks:
  default:
    desc: Print the menu
    # ponytail: hand-maintained listing -- go-task can neither group nor annotate, so a new
    # task means a row below; menu-drift fails until it has one. `task --list` stays the
    # generated view.
    cmds:
      - |
        b= c= d= r=
        if [ -t 1 ] && [ -z "${NO_COLOR:-}" ]; then
          b=$(printf '\033[1m'); c=$(printf '\033[1;36m'); d=$(printf '\033[2m'); r=$(printf '\033[0m')
        fi
        group() { printf '\n%s   %s\n' "$c$1$r" "$d$2$r"; }
        row() {
          if [ ${#1} -le 26 ]; then printf '  %-26s %s\n' "$1" "$2"
          else printf '  %s\n  %-26s %s\n' "$1" '' "$2"; fi
          [ -z "${3:-}" ] || note "$3"
        }
        note() { printf '  %-26s %s\n' '' "$d$1$r"; }

        printf '\n%s   %s\n' "${b}dispatch-cloudflare${r}" "${d}starts GitHub Actions workloads on a schedule, from a Cloudflare Workflow${r}"

        group read 'looks at schedules/, GitHub and Cloudflare, changes nothing'
        row 'task targets' 'What gets dispatched and when, read from schedules/'
        row 'task runs' 'Recent runs of each target on GitHub' "every run should say 'workflow_dispatch'; that is this Worker"
        row 'task logs' 'Live logs (wrangler tail)' 'needs wrangler credentials, as do instances and inspect'
        row 'task instances' 'Recent Workflow instances'
        row 'task inspect [ID=<id>]' "One instance's steps, retries and errors" 'ID defaults to the latest'

        group checks 'offline, no credentials'
        row 'task check' 'Everything CI runs: types, format, tests, dry-run deploy' 'then this menu against the tasks, which CI does not run'
        row 'task typecheck' 'wrangler types && tsc --noEmit'
        row 'task test' 'vitest -- asserts wrangler.jsonc matches schedules/'
        row 'task fmt' 'Fix formatting in place (biome check --write)'

        group build 'writes files in the checkout'
        row 'task crons' "Write wrangler.jsonc's triggers from schedules/" "run after a slot's expression changes or a slot gains its first target"
        row 'task pkcs8' 'Convert the GitHub App key to the PKCS#8 WebCrypto imports' 'setup, once, by hand; README.md has the whole procedure'
        row 'task clean' 'Delete the generated files; the next task rebuilds them' 'node_modules, .wrangler, worker-configuration.d.ts; keeps .pem and .dev.vars'

        group write 'changes Cloudflare or GitHub; needs wrangler credentials'
        row 'task dev' 'Serve locally; /__scheduled?cron=<expr> fires that slot for real' 'needs .dev.vars with the two secrets; it dispatches to GitHub'
        row 'task deploy' 'Deploy by hand; pushing to main does this already'
        row 'task secrets' 'Set the two Worker secrets on Cloudflare' 'setup, once, by hand, after task pkcs8'

        printf '\n%s\n%s\n%s\n%s\n\n' \
          "${d}prove a dispatch for real, in production:${r}" \
          "${d}  npx wrangler workflows trigger dispatch '{\"cron\":\"42 * * * *\",\"scheduledTime\":0}'${r}" \
          "${d}without the JSON the instance has no cron and throws. A newly added cron needs${r}" \
          "${d}minutes to propagate before its first slot; existing ones fire across deploys.${r}"

  # Every public task has a desc and a menu row, and every row names a task. default and
  # help are the menu itself. Needs task and jq wherever lint runs.
  menu-drift:
    internal: true
    cmds:
      - |
        rows=$(grep -oE "row ['\"]task [^ '\"]+" '{{.ROOT_TASKFILE}}' | sed -E "s/^row ['\"]task //" || true)
        bad=$(task -t '{{.ROOT_TASKFILE}}' --list-all --json --no-status | jq -r --arg rows "$rows" '
          ($rows | split("\n") | map(select(. != ""))) as $r
          | [.tasks[] | select(.task != "default" and .task != "help")] as $t
          | ($t[] | select(.desc == "") | "task \(.task): no desc; describe it or mark it internal"),
            ($t[] | select(.task | IN($r[]) | not) | "task \(.task): no row in the menu"),
            ($r[] | select(IN($t[].task) | not) | "row task \(.): no such task")')
        [ -z "$bad" ] || { printf '%s\n' "$bad" >&2; exit 1; }

  # Anything running a binary out of node_modules depends on this, so `task clean` is never
  # a state you have to dig out of by hand. Untouched the failure is `sh: wrangler: command
  # not found`, and the npx tasks are worse: they say nothing and fetch a wrangler from the
  # registry, so a deploy would ship through a version this repo never pinned.
  #
  # `status` is what keeps it free: node_modules already there means the task is skipped, so
  # this costs nothing on every run but the first after a clone or a clean.
  installed:
    internal: true
    status: ['test -x node_modules/.bin/wrangler']
    cmds:
      - 'echo "node_modules is missing -- npm ci"'
      - npm ci

  check:
    desc: Everything CI runs - types, format, tests, dry-run deploy - then the menu against the tasks
    deps: [installed]
    cmds:
      - {task: typecheck}
      - npm run format
      - {task: test}
      # Proves wrangler still parses wrangler.jsonc and resolves the Workflow binding.
      - npx wrangler deploy --dry-run
      - {task: menu-drift}

  test:
    desc: vitest - wrangler.jsonc's triggers are what schedules/ generates
    deps: [installed]
    cmds: [npm test]

  typecheck:
    desc: wrangler types && tsc --noEmit
    deps: [installed]
    cmds: [npm run typecheck]

  fmt:
    desc: Fix formatting in place - biome check --write, no lint rules are enabled
    deps: [installed]
    cmds: [npm run format:fix]

  clean:
    desc: Delete node_modules, .wrangler and worker-configuration.d.ts - the next task rebuilds
    cmds:
      - |
        rm -rf node_modules .wrangler worker-configuration.d.ts
        echo "removed node_modules/, .wrangler/ and worker-configuration.d.ts"
        # A .pem is an App private key GitHub will not hand out twice, and .dev.vars holds
        # the two secrets task dev needs. Both are gitignored, neither is something this
        # can rebuild, and a .pem still here is a live credential worth pointing at.
        for f in .dev.vars *.pem; do
          if [ -e "$f" ]; then echo "kept $f -- nothing here can rebuild it"; fi
        done
        echo "the next task needing node_modules runs npm ci itself"

  # wrangler.jsonc is JSON: it cannot import schedules/, so the crons have to be copied into
  # it. This is the copy. test/schedules.test.ts is what fails until it has been run.
  crons:
    desc: Write wrangler.jsonc's cron triggers from schedules/ - run when the slots in use change
    cmds:
      - |
        node -e 'const {readFileSync, writeFileSync} = await import("node:fs");
        const {crons} = await import("./schedules/index.ts");
        const file = "wrangler.jsonc", before = readFileSync(file, "utf8");
        // ponytail: rewrites the first "crons" array in the file. No cron contains "]", and
        // there is only one such key; a second would be left alone without a word.
        const at = /("crons"\s*:\s*)\[[^\]]*\]/;
        if (!at.test(before)) throw new Error(`no crons array in ${file}`);
        // Written in the style the file is kept in by hand -- biome.json does not cover
        // wrangler.jsonc, so nothing else will format this line.
        const array = `[${crons().map((c) => JSON.stringify(c)).join(", ")}]`;
        writeFileSync(file, before.replace(at, (_, key) => key + array));
        for (const c of crons()) console.log(c)'

  targets:
    desc: What gets dispatched and when, read from schedules/
    cmds:
      - |
        printf '%-10s %-14s %-24s %s\n' SLOT CRON REPO WORKFLOW
        {{.TARGETS}} | while IFS=$'\t' read -r slot cron repo workflow; do
          printf '%-10s %-14s %-24s %s\n' "$slot" "$cron" "$repo" "$workflow"
        done

  runs:
    desc: Recent runs of each target on GitHub - workflow_dispatch ones came from here
    vars:
      LIMIT: '{{.LIMIT | default 10}}'
    cmds:
      - |
        {{.TARGETS}} | while IFS=$'\t' read -r slot cron repo workflow; do
          printf '\n%s %s  (%s, %s)\n' "$repo" "$workflow" "$slot" "$cron"
          gh run list --repo "$repo" --workflow "$workflow" --limit {{.LIMIT}} \
            --json createdAt,event,conclusion \
            --jq '.[] | "  \(.createdAt[0:16] | sub("T"; " "))  \(.event)  \(.conclusion // "running")"'
        done

  deploy:
    desc: Deploy the Worker and its cron triggers to Cloudflare
    deps: [installed]
    cmds: [npm run deploy]

  dev:
    desc: Serve locally - GET /__scheduled?cron=<expr> fires that slot, dispatching for real
    # --test-scheduled is what exposes /__scheduled. The two Worker secrets have to be in
    # .dev.vars (git-ignored), or every dispatch step fails on the App JWT.
    deps: [installed]
    cmds: ['npx wrangler dev --test-scheduled']

  logs:
    desc: Live logs from the deployed Worker
    deps: [installed]
    cmds: ['npx wrangler tail {{.NAME}}']

  instances:
    desc: Recent Workflow instances - one per cron that fired
    deps: [installed]
    cmds: ['npx wrangler workflows instances list {{.NAME}}']

  inspect:
    desc: One instance's steps, retries and errors - ID=<id>, default the latest
    deps: [installed]
    cmds: ['npx wrangler workflows instances describe {{.NAME}} {{.ID | default "latest"}}']

  pkcs8:
    desc: Convert a GitHub App key to PKCS#8 - KEY=app.private-key.pem OUT=app.pkcs8.pem
    vars:
      KEY: '{{.KEY | default "app.private-key.pem"}}'
      OUT: '{{.OUT | default "app.pkcs8.pem"}}'
    cmds:
      # GitHub issues App keys as PKCS#1. WebCrypto imports PKCS#8 only, and github.ts
      # throws on anything else rather than failing inside the first dispatch.
      - openssl pkcs8 -topk8 -nocrypt -in {{.KEY}} -out {{.OUT}}
      - 'echo "wrote {{.OUT}} -- task secrets reads it, then delete both .pem files"'

  secrets:
    desc: Set the two Worker secrets on Cloudflare - KEY=app.pkcs8.pem
    vars:
      KEY: '{{.KEY | default "app.pkcs8.pem"}}'
    deps: [installed]
    cmds:
      - 'npx wrangler secret put GITHUB_APP_ID'
      # Piped, not prompted. `wrangler secret put` reads a single line when it has a
      # terminal, so a pasted PEM would store its BEGIN line and nothing else -- and that is
      # a non-empty value, which wrangler accepts. Given no TTY it reads stdin to the end.
      - 'npx wrangler secret put GITHUB_APP_PRIVATE_KEY < {{.KEY}}'
